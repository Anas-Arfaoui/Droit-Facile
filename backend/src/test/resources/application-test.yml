spring:
  datasource:
    url: jdbc:h2:mem:droitfacile;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  ocr:
    enabled: false
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration-ms: 3600000
  admin:
    email: admin-test@droitfacile.test
    password: Admin12345
  notifications:
    cron: "0 0 8 * * *"
