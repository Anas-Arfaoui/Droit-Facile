spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/droitfacile
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  ocr:
    enabled: ${APP_OCR_ENABLED:false}
    command: ${APP_OCR_COMMAND:tesseract}
    languages: ${APP_OCR_LANGUAGES:fra+ara}
  jwt:
    secret: change-me-change-me-change-me-change-me-123456
    expiration-ms: 86400000

  admin:
    email: admin@droitfacile.com
    password: Admin12345
  notifications:
    cron: "0 0 8 * * *"

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always
