services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: droitfacile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d droitfacile"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/droitfacile
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: change-me-change-me-change-me-change-me-123456
      APP_JWT_EXPIRATION_MS: 86400000
      APP_ADMIN_EMAIL: admin@droitfacile.com
      APP_ADMIN_PASSWORD: Admin12345
      APP_STORAGE_DIR: /data/uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8081/api
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data: